[[func]]
vram = 0x800BEF14
name = "cs_water_spray_update"
sig = "void cs_water_spray_update(Effect *fx, s32 on, s16 wheel)"
desc = "A wheel's water spray (callbacks 0x800BF15C/80/A4/C8 for wheels 0-3): on material 2 with +0x438 > 0 shows the spray node (fx +8), scale min(+0x438 / 40 + 0.5, 2.5) at the wheel point (state +0xC0) + (0, r - 0.835 scale, 0.9 - r), r the car type's wheel scale (0x8007D1DC front, 0x8007D230 rear), and sets SPLASHLEFT_ / SPLASHRIGHT_'s texture to SPLASH01-04 by frame & 3; else hides it."
consts = "40.0 = speed divisor; 0.5 = base scale; 2.5 = max scale; 0.835, 0.9 = offsets (ft)"
status = "verified"
area = "render"
ref = "docs/calspeed_research.md#wheel-effects"

