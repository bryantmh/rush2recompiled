# Function registry for calspeed. Format and tooling: tools/names.py (docstring). Keep sorted; run `names.py fmt`.

[[func]]
vram = 0x8005629C
name = "snd_engine_pitch_law"
sig = "f32 snd_engine_pitch_law(f32 *pitch, s32 index, s16 slot)"
desc = "Engine layer pitch: *pitch = min(slot rpm (0x80168F68[slot]) / base 0x80058198[index], 2.0); 1.0 when the layer's sound 0x80058228[index] is 0x23. index = (voice id - 1) * 2 + layer. Also stores it at 0x800F93E0."
consts = "0x23 = silent engine layer sound; 2.0 = pitch cap"
status = "verified"
ported = true
rush2 = 0x80062598
link = "role"
area = "audio"
ref = "docs/calspeed_research.md#engine-sounds"

