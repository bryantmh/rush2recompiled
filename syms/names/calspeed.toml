[[func]]
vram = 0x800564B0
name = "snd_engine_volume_law"
sig = "s32 snd_engine_volume_law(s32 layer, s32 load_index, s32 rpm_index)"
desc = "Engine layer volume = (int)((int)(A[layer][rpm_index] * B[layer][load_index] * 1635 + 3270 * 6) * engine volume (0x80150B31) / 40), A = 0x80058354 (2 x 11), B = 0x800582B8 (2 x 13), 1635 at 0x800AE3DC, 6 at 0x800AE3E0 (constants; Rush 2: x 2000 + 24000)."
consts = "1635.0 (0x800AE3DC) = volume scale; 6 x 3270 (0x800AE3E0) = volume base; 40 = engine volume option max"
status = "verified"
ported = true
rush2 = 0x800624E4
link = "role"
area = "audio"
ref = "docs/calspeed_research.md#engine-sounds"

[[func]]
vram = 0x80056594
name = "engine_sound_start"
sig = "void engine_sound_start(s32 engine, s32 slot)"
desc = "Starts engine `engine` (0-8) on local slot `slot`: sends command 0x1FFE + slot and sets 0x801427C0[slot] = engine + 9 * slot + 1 (Rush 2: + 10 * slot), under a lock (0x800539AC / 0x800539E8)."
consts = "0x1FFE = engine start command; 9 = engines per slot"
status = "verified"
rush2 = 0x8008C61C
link = "role"
area = "audio"
ref = "docs/calspeed_research.md#engine-sounds"

[[func]]
vram = 0x800565FC
name = "snd_engine_slot_start"
sig = "void snd_engine_slot_start(s32 slot)"
desc = "Audio command 0x1FFE / 0x1FFF: starts the slot's two engine layers (0x80058220[id * 2 + layer], id = 0x801427C0[slot]) at the law's pitch and volume via 0x800555BC, sets 0x80149D44[slot] = 1."
status = "verified"
ported = true
rush2 = 0x800626FC
link = "role"
area = "audio"
ref = "docs/calspeed_research.md#engine-sounds"

[[func]]
vram = 0x80056724
name = "snd_engine_voices_update"
sig = "void snd_engine_voices_update(void)"
desc = "Every audio frame, for each slot with an engine (0x801427C0, 0x80149D44): finds each layer's playing voice among the 16 at 0x801418C0 and sets its volume (snd_engine_volume_law; 0 for sound 0x23), pitch (snd_engine_pitch_law) and FX mix (0x80134384[slot] low byte). Skipped while 0x80022D20 or byte 0x800FF260 is set."
consts = "0x23 = silent layer sound; 16 = sound voices"
status = "verified"
ported = true
rush2 = 0x80062CC4
link = "role"
area = "audio"
ref = "docs/calspeed_research.md#engine-sounds"

