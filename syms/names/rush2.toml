# Function registry for rush2. Format and tooling: tools/names.py (docstring). Keep sorted; run `names.py fmt`.

[[func]]
vram = 0x80000450
desc = "Patched in us.toml. Boot main reads 16 words from cart address 0xFFB000 (past the end of the 12MB ROM) into a stack buffer that is never used. Skip the read so the runtime doesn't read out of bounds."
status = "inferred"
ported = true
ref = "us.toml"

[[func]]
vram = 0x800005D8
desc = "Patched in us.toml. The game inflates its code segments itself (func_800059D4). Tell the runtime about the code once each segment has been decompressed into RDRAM. Main code: inflated by the boot thread to 0x800539E0."
status = "inferred"
ported = true
ref = "us.toml"

