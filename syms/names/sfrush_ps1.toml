desc = "Moves every car: position += velocity x step / 128 (step by class 0x80/0x84/0x88/0x94; drones the player's class, 0x90 for class 3, plus 6 after their first 40 frames), then velocity += the frame's forces (0x800ED0FC). As the player's car the UFO doubles them under speed 100 and halves the vertical one above; PIGGY halves them over 301 and quarters them over 351. In snow (0x800B2710 == 1) every car's horizontal forces are halved from speed 151 and quartered from 301 instead (all halved with the UFO picked), and the dry rules are skipped."
consts = "0x80/0x84/0x88/0x94 = class steps; 0x64/0x12D/0x15F = speeds; 0x97/0x12D = snow speeds; 0x408 = car stride"
