[[func]]
vram = 0x80041244
name = "props_update"
sig = "void props_update(s32 car)"
desc = "Draws and runs the props for a car's view: knocks a cone away when the car hits it; on track 4 runs each tram back and forth along x between 6397 and 22115 at 24 a frame (state 1 up, 2 down) and wrecks (car +0x352 |= 0x8000) any car within 0xE8 along and 0x60 across it. The pickups don't turn (their rotation stays 0; the +0x28 angle is kind 0's). A clock (kind 8) is drawn at 0x80041484 by func_80046DD4 with a1 = CLUT id 0x1037 (VRAM 880,64, ART/PICKUPS.GFX's), page gp+0x2F8 = 13 (VRAM 832,0) at v + gp+0x2FC (0x40): the hourglass is PICKUPS.GFX u 64-127. Taking one (0x80041538): state 0 for the race, 20 s added to the clock gp+0x144 (24 at difficulty 0x800B288C 5, 27 at 6) and sound 3 (GAMESND.BNK CHECK) played by func_80020750 centered at pitch 0x8CA. Kind 9 (key, 0x80041628): counted in 0x800B353C, the 4th of a race sets the track's unlock flag 0x800B2838 + 4 x track (docs/sfrush_ps1.md#unlocks)."
consts = "0x18FD/0x5663 = tram ends (x, 0.1 ft); 0x18 = tram step a frame; 0xE8/0x60 = tram's wreck box half sizes"
status = "verified"
area = "track"
ref = "docs/sfrush_ps1.md#props"

