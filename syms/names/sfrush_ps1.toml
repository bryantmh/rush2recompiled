# Function registry for sfrush_ps1. Format and tooling: tools/names.py (docstring). Keep sorted; run `names.py fmt`.

[[func]]
vram = 0x800142C4
name = "special_car_setup"
desc = "Race setup from the menu choices: sets the car type 0x800B2BEC for the special car gp+0x28 (STARSKY 6, JEEP 5, JETCAR 3, MINI 4, BBUS 1, TAXI 0, PIGGY 2 and white paint, UFO 7), snow gp+0x40, night gp+0x98, and the stunt road 0x800B2AA0 (track 1, when the variant value gp+0x48 is 3 and 0x800B2C64 is set)."
status = "verified"
area = "car"
ref = "docs/sfrush_ps1.md#cars"

[[func]]
vram = 0x80014F38
name = "clut_upload_shaded"
sig = "void clut_upload_shaded(s32 x, s32 y, u8 *gfx)"
desc = "Uploads the 16-color CLUT at gfx+8 to VRAM (x, y) and 31 copies under it, each a step brighter or darker per channel (gp+0x98 picks), for distance shading. Color 0 (transparent) is left alone."
consts = "0x20 = rows; 0x1A / 1 = channel clamp"
status = "verified"
area = "render"
ref = "docs/sfrush_ps1.md#textures"

[[func]]
vram = 0x80015090
name = "clut_upload_dark"
sig = "void clut_upload_dark(s32 x, s32 y, u8 *gfx)"
desc = "Like clut_upload_shaded: uploads the 16-color CLUT at gfx+8 to VRAM (x, y) and 31 copies under it, but each copy a step darker per channel whatever the time of day (clamped at 1), and color 0 is darkened too (no longer transparent from row 1). Track 2's CLUT loader uses it for the tunnel's two CLUTs."
consts = "0x20 = rows; 0x14 - 4 = 16 colors; 1 = channel floor"
status = "verified"
area = "render"
ref = "docs/sfrush_ps1.md#textures"

[[func]]
vram = 0x800155F8
name = "props_place"
sig = "void props_place(void)"
desc = "Fills the prop array 0x80108810 (0x2C each: state, kind, position, rotation, model, texture table) from 16-byte records (x, y, height in 0.1 ft, kind; -1 ends): 0x800A55B4 for track 2, 0x800A58B4 for track 4 (kind 0 cone gp+0xD60, 1 tram gp+0xD64, 2 T2K003 gp+0xD6C), then, when gp+0x3C is set, the pickups of the current track (gp+0xE28; records x, y, height, track 0-3): 0x800A59C4 (kind 8, extra/time.psv at gp+0xCF0) and 0x800A5E44 at 0x80015A90 (kind 9, the 4 keys per track, extra/key.psv at gp+0xB6C). | The race loop too (func_80014BF4 calls it once a race; the props are placed at its start): Explosive (0x800B2700) at 0x80015E24 turns Extreme 0x800B26FC on and clears the bomb 0x800B2704; at 0x800161A8 the speedometer mph 0x801106F8 >= 66 arms it, armed and < 60 sets the player's wreck bit 0x8010153A |= 0x8000 unless finished (0x80101254). The clocks (0x800A59C4, kind 8) are placed only in Time Sprint (0x800B270C); the keys always. At a race end (0x80017474) Extreme with gp+0x150 > 0 sets the loss gp+0x58; circuit (gp+0xC, 8 races) and Grand Prix (gp+0x10, 10 races) races are counted."
consts = "0x800A5E44 = the keys table (docs/sfrush_ps1.md#keys); 8 / 9 = time / key pickup kinds"
status = "verified"
area = "track"
ref = "docs/sfrush_ps1.md#props"

