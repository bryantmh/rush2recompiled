# N64Recomp config for Rush 2: Extreme Racing USA (NR2E).
# Run tools/extract.py and tools/gen_syms.py first.

[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
output_func_path = "RecompiledFuncs"
symbols_file_path = "syms/rush2.us.syms.toml"
rom_file_path = "rush2.us.recomp.z64"
recomp_include = "#include \"recomp.h\"\n#include \"rush2_hooks.h\""

[patches]
stubs = [
    # 64DD interrupt helper that pokes PI registers directly; never reached.
    "func_80017324",
    # libultra internals only reachable from functions the runtime reimplements
    # (VI manager thread, motor/pfs helpers, 64DD thread handling).
    "func_80006968",
    "func_8000CC30",
    "func_8000E4A8",
    "func_8000E570",
    "func_8001740C",
    "func_800159E4",
    "func_800162EC",
    "func_80016AF4",
    "__osBlockSum",
]

ignored = [
    # Handwritten ll/sc atomic bit set/clear helpers; reimplemented in src/atomics.cpp.
    "func_80003B34",
    "func_80003B54",
    # Copy of __osGetId called directly by the game's pak thread; reimplemented in src/atomics.cpp.
    "func_8000D090",
    # osStartThread/osStopThread; reimplemented with libultra semantics in src/threads.cpp.
    "rush2_osStartThread",
    "rush2_osStopThread",
    # Controller Pak file system functions; reimplemented on top of a .mpk file in src/pak.cpp.
    "rush2_osPfsInitPak",
    "rush2_osPfsFindFile",
    "rush2_osPfsFileState",
    "rush2_osPfsDeleteFile",
    "rush2_osPfsAllocateFile",
    "rush2_osPfsReadWriteFile",
    "rush2_osPfsFreeBlocks",
    "rush2_osPfsChecker",
]

# The game inflates its code segments itself (func_800059D4). Tell the runtime
# about the code once each segment has been decompressed into RDRAM.

# Main code: inflated by the boot thread to 0x800539E0.
[[patches.hook]]
func = "func_800005D8"
before_vram = 0x8000071C
text = "    load_overlays(0x01000000, (int32_t)0x800539E0, 0x691D0);"

# Overlay: inflated to 0x803AA800 by func_800A62C0.
[[patches.hook]]
func = "func_800A62C0"
before_vram = 0x800A6314
text = "    load_overlays(0x01080000, (int32_t)0x803AA800, 0x1C190);"

# Boot main reads 16 words from cart address 0xFFB000 (past the end of the 12MB ROM) into a
# stack buffer that is never used. Skip the read so the runtime doesn't read out of bounds.
[[patches.instruction]]
func = "func_80000450"
vram = 0x80000484
value = 0x00000000 # jal osPiRawReadIo -> nop

# Busy-wait loops on the pending graphics task counter (D_8001AA9C, updated by the scheduler thread
# when tasks complete). Game threads are cooperative under the runtime, so yield inside each loop.
[[patches.hook]]
func = "func_800834F4"
before_vram = 0x80083554
text = "    yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_8009FB40"
before_vram = 0x8009FB74
text = "    yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800A4B04"
before_vram = 0x800A4B78
text = "    yield_self_1ms(rdram);"

[[patches.hook]]
func = "func_800AB878"
before_vram = 0x800AB8A4
text = "    yield_self_1ms(rdram);"

# Widescreen and no letterboxing: each player view's 3D scissor is inset by the overscan border,
# e.g. (12,10)-(308,230) in single player. RT64 only widens projections whose scissor spans the
# framebuffer, so extend views that touch the border to the framebuffer edges (320x240). Geometry past
# the viewport edge is still rasterized (N64 guard band), so the top/bottom bars fill in without zooming.
# $t2..$t5 hold ulx, uly, lrx, lry in pixels here.
[[patches.hook]]
func = "func_8007C624"
before_vram = 0x8007C7B4
text = "    if ((int32_t)ctx->r10 <= 12 && (int32_t)ctx->r12 >= 308) { ctx->r10 = 0; ctx->r12 = 320; } if ((int32_t)ctx->r11 <= 10) { ctx->r11 = 0; } if ((int32_t)ctx->r13 >= 230) { ctx->r13 = 240; }"

# The frame setup clears to the fog color inside the overscan inset and fills the border black, which shows through
# skies that are just the clear color now that views extend over the border. Zero the insets (D_80023058/5A) while
# the clear and border fills are emitted (src/widescreen.cpp): from loading them for the clear rect until the call
# that follows the right border fill.
[[patches.hook]]
func = "func_800B45B4"
before_vram = 0x800B47E8
text = "    rush2_frame_clear_begin(rdram, ctx);"

[[patches.hook]]
func = "func_800B45B4"
before_vram = 0x800B4998
text = "    rush2_frame_clear_end(rdram, ctx);"


# Rumble alongside the Controller Pak. On hardware a port holds either a Controller Pak or a Rumble Pak, and
# the game's pak thread only enables rumble for a port when osPfsInitPak fails with an ID/device error and
# osMotorInit succeeds. Right after a Controller Pak initializes successfully (L_80099458), also register the
# port with the rumble code. $s1 = port, the initialized OSPfs is at $sp+0xD0.
[[patches.hook]]
func = "func_80098D14"
before_vram = 0x80099458
text = "    rush2_enable_pak_rumble(rdram, ctx);"

# HUD edge anchoring (src/hud.cpp). The race HUD setup func_800A06F8 creates the HUD's widgets through the widget
# allocator func_800541F8, and the widget loop in func_8007D9DC draws them with an RT64 rect alignment per widget.
[[patches.hook]]
func = "func_800A06F8"
before_vram = 0x800A06F8
text = "    rush2_hud_build_begin(rdram, ctx);"

[[patches.hook]]
func = "func_800A06F8"
before_vram = 0x800A0DF4
text = "    rush2_hud_build_end(rdram, ctx);"

# Widget initialized: $v1 = slot, $a0 = widget.
[[patches.hook]]
func = "func_800541F8"
before_vram = 0x800542D0
text = "    rush2_hud_widget_created(rdram, ctx);"

# Before the widget draw loop.
[[patches.hook]]
func = "func_8007D9DC"
before_vram = 0x8007EAD4
text = "    rush2_hud_draw_begin(rdram, ctx);"

# Top of the widget draw loop, $fp = widget.
[[patches.hook]]
func = "func_8007D9DC"
before_vram = 0x8007EAD8
text = "    rush2_hud_draw_widget(rdram, ctx);"

# After the widget draw loop.
[[patches.hook]]
func = "func_8007D9DC"
before_vram = 0x8007F0DC
text = "    rush2_hud_draw_end(rdram, ctx);"

# Frame interpolation: stable RT64 matrix group IDs for everything the 3D renderer draws (src/interpolation.cpp).
# func_8007C624 draws one player view; func_8007B518 recursively draws a scene graph level.
[[patches.hook]]
func = "func_8007C624"
before_vram = 0x8007C624
text = "    rush2_interp_view_begin(rdram, ctx);"

# Projection G_MTX written at $v0.
[[patches.hook]]
func = "func_8007C624"
before_vram = 0x8007CBB4
text = "    rush2_interp_projection(rdram, ctx);"

# Root modelview G_MTX written at $v0.
[[patches.hook]]
func = "func_8007C624"
before_vram = 0x8007CF50
text = "    rush2_interp_root_modelview(rdram, ctx);"

# G_RDPPIPESYNC starting a world-space polygon written at $v0, $fp = polygon.
[[patches.hook]]
func = "func_8007C624"
before_vram = 0x8007D03C
text = "    rush2_interp_poly(rdram, ctx);"

# Function exit (reached by both paths after the deferred scene graph draw).
[[patches.hook]]
func = "func_8007C624"
before_vram = 0x8007D9CC
text = "    rush2_interp_view_end(rdram, ctx);"

[[patches.hook]]
func = "func_8007B518"
before_vram = 0x8007B518
text = "    rush2_interp_level_enter(rdram, ctx);"

# Loop head, once per sibling node.
[[patches.hook]]
func = "func_8007B518"
before_vram = 0x8007B5AC
text = "    rush2_interp_node_begin(rdram, ctx);"

# Node G_MTX written at $v0, $s7 = node.
[[patches.hook]]
func = "func_8007B518"
before_vram = 0x8007B91C
text = "    rush2_interp_node_matrix(rdram, ctx);"

# After a pushed node: G_POPMTX written (if $s2 != 0) or the node's G_MTX rolled back.
[[patches.hook]]
func = "func_8007B518"
before_vram = 0x8007BD7C
text = "    rush2_interp_node_pop(rdram, ctx);"

[[patches.hook]]
func = "func_8007B518"
before_vram = 0x8007BDC8
text = "    rush2_interp_level_exit(rdram, ctx);"

# Level of detail override (src/lod.cpp). func_8007AA48 draws a node's model; every path has stored the node's
# camera distance in D_80117490 by here, and it is read only to cull and pick the LOD. $s7 = node.
[[patches.hook]]
func = "func_8007AA48"
before_vram = 0x8007ABB8
text = "    rush2_lod_select(rdram, ctx);"

# Text printed by HUD callback widgets (laps left, lap times). $a0 = x.
[[patches.hook]]
func = "func_800734E0"
before_vram = 0x800734E0
text = "    rush2_hud_print(rdram, ctx);"

# Laps-left number, printed by the sprite callback func_800B9D48 through a printf wrapper. $a0/$a1 = x/y.
[[patches.hook]]
func = "func_800B9D48"
before_vram = 0x800BA148
text = "    rush2_hud_laps_begin(rdram, ctx);"

[[patches.hook]]
func = "func_800B9D48"
before_vram = 0x800BA150
text = "    rush2_hud_laps_end(rdram, ctx);"
