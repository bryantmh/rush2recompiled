# are this machine's players' cars (rush2_online_engine_start).
[[patches.hook]]
func = "race_start_player_engine_8009E664"
before_vram = 0x8009E664
text = "    if (rush2_online_engine_start(rdram, ctx)) return;"

# Online: the engine slots' rpm and load come from this machine's players' cars (rush2_online_engine_car). Slot 0's car
# is $a0; slot 1's is $s0 + $t9, added in the call's delay slot.
[[patches.hook]]
func = "physics_stage_post_snapshot_8006890C"
before_vram = 0x80068AD4
text = "    ctx->r4 = (gpr)(int32_t)rush2_online_engine_car(rdram, 0, (uint32_t)ctx->r4);"

[[patches.hook]]
func = "physics_stage_post_snapshot_8006890C"
before_vram = 0x80068B3C
text = "    ctx->r25 = (gpr)(int32_t)(rush2_online_engine_car(rdram, 1, (uint32_t)(ctx->r16 + ctx->r25)) - (uint32_t)ctx->r16);"

