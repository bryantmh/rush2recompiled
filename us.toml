before_vram = 0x800A1254
text = "    rush2_hud_finish_begin(rdram, ctx);"

[[patches.hook]]
func = "func_800A0FB4"
before_vram = 0x800A126C
text = "    rush2_hud_finish_end(rdram, ctx);"

