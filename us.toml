# N64Recomp config for Rush 2: Extreme Racing USA (NR2E).
# Run tools/extract.py and tools/gen_syms.py first.

[input]
entrypoint = 0x80000400
# Paths are relative to the location of this config file.
output_func_path = "RecompiledFuncs"
symbols_file_path = "syms/rush2.us.syms.toml"
rom_file_path = "rush2.us.recomp.z64"
recomp_include = "#include \"recomp.h\"\n#include \"rush2_hooks.h\""

[patches]
stubs = [
    # 64DD interrupt helper that pokes PI registers directly; never reached.
    "os_leo_pi_poke_80017324",
    # libultra internals only reachable from functions the runtime reimplements
    # (VI manager thread, motor/pfs helpers, 64DD thread handling).
    "vi_manager_thread_80006968",
    "os_motor_pack_verify_buffer_8000CC30",
    "os_pfs_write_page_bank_8000E4A8",
    "os_pfs_inode_page_rw_8000E570",
    "os_leo_dispatch_thread_8001740C",
    "os_pfs_check_pack_800159E4",
    "os_cont_ram_read_pack_request_800162EC",
    "os_cont_ram_write_pack_request_80016AF4",
    "__osBlockSum",
]

ignored = [
    # Handwritten ll/sc atomic bit set/clear helpers; reimplemented in src/atomics.cpp.
    "atomic_set_bits_80003B34",
    "atomic_clear_bits_80003B54",
    # Copy of __osGetId called directly by the game's pak thread; reimplemented in src/atomics.cpp.
    "os_get_id_8000D090",
    # osStartThread/osStopThread; reimplemented with libultra semantics in src/threads.cpp.
    "rush2_osStartThread",
    "rush2_osStopThread",
    # Controller Pak file system functions; reimplemented on top of a .mpk file in src/pak.cpp.
    "rush2_osPfsInitPak",
    "rush2_osPfsFindFile",
    "rush2_osPfsFileState",
    "rush2_osPfsDeleteFile",
    "rush2_osPfsAllocateFile",
    "rush2_osPfsReadWriteFile",
    "rush2_osPfsFreeBlocks",
    "rush2_osPfsChecker",
]

# The game inflates its code segments itself (func_800059D4). Tell the runtime
# about the code once each segment has been decompressed into RDRAM.

# Main code: inflated by the boot thread to 0x800539E0.
[[patches.hook]]
func = "boot_main_thread_800005D8"
before_vram = 0x8000071C
text = "    load_overlays(0x01000000, (int32_t)0x800539E0, 0x691D0);"

# Analog pedals: at the exit of the function that sets the car's throttle (+0x734) and brake (+0x730) from the held
# buttons, scale a pressed pedal by trigger pressure (src/input.cpp). $s0 = car, $s1 = player.
[[patches.hook]]
func = "car_set_pedals_80076854"
before_vram = 0x800769F0
text = "    rush2_analog_pedals(rdram, ctx);"

# Directional rumble (src/rumble.cpp): in physics_car_tick, at the start of the block that sets a human car's rumble
# level. $a2 = car, $a3 = player.
[[patches.hook]]
func = "physics_car_tick_80075880"
before_vram = 0x80075B90
text = "    rush2_rumble_impact(rdram, ctx);"

# Smooth-shaded collision (src/smooth_collision.cpp): in the wheel probe after the surface dispatch (flat plane, spline
# or arc), 0x94($sp) = the POLY found, 0x13C($sp) = the wheel's point, $s1 = the result (its [1] the height), *0x148($sp)
# = the wheel's frame. On a California Speed or custom track a flat floor polygon's frame and height come from the
# smooth surface instead.
[[patches.hook]]
func = "collision_poly_extract_8006F704"
before_vram = 0x8006FA70
text = "    rush2_smooth_collision_surface(rdram, ctx);"

# ... and its crack filling: the probe's leaf polygon count is noted at the entry (0) and once the leaf is decoded
# ($t1 = count, the list at 0xA4($sp)); at 0x8006FBD0 (no polygon held the wheel's point) a floor polygon within a foot
# of the point is taken on a California Speed or custom track and the probe continues at 0x8006FA70 with it; when none
# is, CS Physics notes the missed wheel (rush2_calspeed_probe_miss, src/calspeed/calspeed_walls.cpp).
[[patches.hook]]
func = "collision_poly_extract_8006F704"
before_vram = 0x8006F748
text = "    rush2_smooth_collision_leaf(rdram, ctx, 0);"

[[patches.hook]]
func = "collision_poly_extract_8006F704"
before_vram = 0x8006F860
text = "    rush2_smooth_collision_leaf(rdram, ctx, (int)ctx->r9);"

[[patches.hook]]
func = "collision_poly_extract_8006F704"
before_vram = 0x8006FBD0
text = "    if (rush2_smooth_collision_gap(rdram, ctx)) goto L_8006FA70; rush2_calspeed_probe_miss(rdram, ctx);"

# Debug for the smooth collision (RUSH2_SMOOTH_LOG=2, src/smooth_collision.cpp): after each wheel's probe.
[[patches.hook]]
func = "car_ground_contact_800703EC"
before_vram = 0x8007057C
text = "    rush2_smooth_debug_contact(rdram, ctx); rush2_csphys_probe(rdram, ctx);"

# Directional rumble's wall grinding (src/rumble.cpp): in car_wall_collision_query, where a body probe is inside a wall
# and the car is about to be pushed out along the normal at sp+0xB0. $s1 = car. Also Rush 2049 stunt scoring's body hit
# (src/rush2049/stunt2049.cpp: 2049 sets car +0x7D4 bit 0x100000 at the same push, func_800C3880).
[[patches.hook]]
func = "car_wall_collision_query_8006FC94"
before_vram = 0x8006FF60
text = "    rush2_rumble_wall(rdram, ctx); rush2_stunt2049_body_hit(rdram, ctx);"

# Overlay: inflated to 0x803AA800 by func_800A62C0.
[[patches.hook]]
func = "overlay_load_800A62C0"
before_vram = 0x800A6314
text = "    load_overlays(0x01080000, (int32_t)0x803AA800, 0x1C190); rush2_track49_overlay_loaded(rdram, ctx); rush2_pak_menu_overlay_loaded(rdram, ctx);"

# Boot main reads 16 words from cart address 0xFFB000 (past the end of the 12MB ROM) into a
# stack buffer that is never used. Skip the read so the runtime doesn't read out of bounds.
[[patches.instruction]]
func = "boot_main_80000450"
vram = 0x80000484
value = 0x00000000 # jal osPiRawReadIo -> nop

# Busy-wait loops on the pending graphics task counter (D_8001AA9C, updated by the scheduler thread
# when tasks complete). Game threads are cooperative under the runtime, so yield inside each loop.
[[patches.hook]]
func = "asset_wait_gfx_and_load_containers_800834F4"
before_vram = 0x80083554
text = "    yield_self_1ms(rdram);"

[[patches.hook]]
func = "mem_reset_heap_and_scene_8009FB40"
before_vram = 0x8009FB74
text = "    yield_self_1ms(rdram);"

[[patches.hook]]
func = "asset_load_track_container_800A4B04"
before_vram = 0x800A4B78
text = "    yield_self_1ms(rdram);"

[[patches.hook]]
func = "race_asset_slots_init_for_track_800AB878"
before_vram = 0x800AB8A4
text = "    yield_self_1ms(rdram);"

# Widescreen and no letterboxing: each player view's 3D scissor is inset by the overscan border,
# e.g. (12,10)-(308,230) in single player. RT64 only widens projections whose scissor spans the
# framebuffer, so extend views that touch the border to the framebuffer edges (320x240). Geometry past
# the viewport edge is still rasterized (N64 guard band), so the top/bottom bars fill in without zooming.
# Views touching only one side (the 2 player car select's halves) get an extended GBI scissor anchored to that
# window edge instead, and a viewport inset from an edge the scissor now reaches (the top view of a 2 player race)
# is moved back to it (src/widescreen.cpp). $t2..$t5 hold ulx, uly, lrx, lry in pixels here, $s1 = viewport.
[[patches.hook]]
func = "view_fog_setup_8007C624"
before_vram = 0x8007C7B4
text = "    rush2_view_scissor(rdram, ctx);"

# G_SETSCISSOR written at $a1.
[[patches.hook]]
func = "view_fog_setup_8007C624"
before_vram = 0x8007C8D4
text = "    rush2_view_scissor_written(rdram, ctx);"

# The frame setup clears to the fog color inside the overscan inset and fills the border black, which shows through
# skies that are just the clear color now that views extend over the border. Zero the insets (D_80023058/5A) while
# the clear and border fills are emitted (src/widescreen.cpp): from loading them for the clear rect until the call
# that follows the right border fill.
[[patches.hook]]
func = "gfx_frame_setup_800B45B4"
before_vram = 0x800B47E8
text = "    rush2_frame_clear_begin(rdram, ctx);"

[[patches.hook]]
func = "gfx_frame_setup_800B45B4"
before_vram = 0x800B4998
text = "    rush2_frame_clear_end(rdram, ctx);"

# Split screen layout (src/splitscreen.cpp). func_80054BB0 sets up the race views ($a0 = count, or 0 to return the
# split flag, which the frame setup does every frame); the views are rewritten side by side at its return.
[[patches.hook]]
func = "view_setup_split_screen_80054BB0"
before_vram = 0x80054BB0
text = "    rush2_split_views_begin(rdram, ctx);"

[[patches.hook]]
func = "view_setup_split_screen_80054BB0"
before_vram = 0x80054D8C
text = "    rush2_split_views_end(rdram, ctx);"

# The frame setup's black line between the stacked views (G_FILLRECT at $v1 when $v0, the split flag, is set).
[[patches.hook]]
func = "gfx_frame_setup_800B45B4"
before_vram = 0x800B4A0C
text = "    rush2_split_divider(rdram, ctx);"

# Menu background (src/widescreen.cpp): extends the animated "RUSH2" mesh past the 4:3 edges. func_8007AA48 is
# about to emit the G_DL for a node's model, $fp = model display list.
[[patches.hook]]
func = "model_draw_8007AA48"
before_vram = 0x8007AF84
text = "    rush2_model_draw(rdram, ctx);"

# Title attract background (src/widescreen.cpp): continues the tiled "RUSH2" widgets past the 4:3 edges. func_800ABE7C
