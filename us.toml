# The game's per-frame state machine (func_800AE670): after a race with 3 or 4 players, the counts go back to 2 for the
# post-race records (state 6, func_800A952C), whose per-player arrays and name entry exist for two players (four
# overflowed them into the audio voices). Race over (states 4 and 5: every player's place, GAME OVER) keeps all four.
[[patches.hook]]
func = "race_start_timer_800AE670"
before_vram = 0x800AE674
text = "    rush2_players4_state(rdram, ctx);"

# Race end (func_800AE670): once players 1 and 2 have finished (0x800AEF14), the race also waits for players 3 and 4.
[[patches.hook]]
func = "race_start_timer_800AE670"
before_vram = 0x800AEF14
text = "    if (!rush2_players4_all_finished(rdram, ctx)) goto L_800AEED0;"

