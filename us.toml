[[patches.hook]]
func = "func_800A06F8"
before_vram = 0x800A06F8
text = "    rush2_hud_build_begin(rdram, ctx);"

[[patches.hook]]
func = "func_800A06F8"
before_vram = 0x800A0DF4
text = "    rush2_hud_build_end(rdram, ctx);"

# The race's finish overlay (func_800A0FB4 builds each player's place from 0x800BF328): laid out like the HUD, with
# players 3 and 4's added (src/players4.cpp).
[[patches.hook]]
func = "func_800A0FB4"
before_vram = 0x800A1210
text = "    if (rush2_players4_skip_finish_box(rdram, ctx)) goto L_800A121C;"

[[patches.hook]]
func = "func_800A0FB4"
before_vram = 0x800A124C
