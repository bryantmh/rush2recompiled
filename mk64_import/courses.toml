# Per-course data for mk64_track.py: what the MK64 game code sets up for a course and the ROM doesn't hold as data
# next to it, transcribed from the mk64 decomp (github.com/n64decomp/mk64, US version). Everything else (geometry,
# textures, collision lists, the AI path) is read from the course's own ROM data and found by its shape (mk64.py).
#
# [rom]                      addresses in the US ROM
# [course.<name>]            <name> as mk64.COURSE_NAMES (the decomp's courses/ folder names)
#   name                     shown in Rush 2
#   vertex_colors            init_course() find_vtx_and_set_colours(dl, alpha, r, g, b) calls (src/racing/
#                            render_courses.c): every vertex the DL loads gets the alpha, and the color when r != 0
#   render_mode              the render mode render_<course>() sets before the section lists: opa (default), texedge
#   stars                    a StarData table (vram, src/data/some_data.c) drawn on the sky: init_stars()
#   kill_below               a COL_KILL sheet under the course (courses where falling off means Lakitu)
#   wall_height              meters of collision added above the walls' top edges (Rush 2 cars jump higher)
#   checkpoints              CHECKPOINT_n count, spaced evenly along the lap
#   ai_speed                 [[path point, mph], ...] AISPEED_<mph> markers (0 lifts the cap): Rush 2 tuning, not MK64
#   dl_list, sections, path  segment 6 addresses, only where the shape search in mk64.py picks the wrong table
#
# Battle courses (type = "battle"; render_<course>() and course_generate_collision_mesh() in render_courses.c,
# spawn_players_4p_battle() in spawn_players.c):
#   draw                     the DLs drawn; double_sided: those of them drawn with culling off
#   collision                [[DL, surface type], ...]
#   kill_y                   the fall height D_8015F8E4: a number, or "min" (the lowest collision vertex - 10)
#   spawn_y, spawns          the 4 player starts: [[x, z, yaw], ...], on the ground under spawn_y
#   item_boxes               the item box ActorSpawnData table: the Rush 2049 pickups
#
# Actors (spawn_course_actors() and init_actors() in src/racing/actors.c, the render code in src/actors/):
#   seg3                     init_actors()'s course textures after the common 0x9000 bytes, as ROM offsets of their
#                            MIO0 (assets/*.json rom_offset), or [offset, alloc] when alloc isn't 0x800
#   [[course.<name>.actors]]
#     name                   the mesh's name (ACTOR_<name>; MOVE_<name><n> for moving ones)
#     dl, variants           the model's DL (or DLs), or one DL (list) per spawn id (palm trees, cows)
#     spawns, at, ids        an ActorSpawnData table, or [[x, y, z, yaw degrees], ...]; ids keeps those spawn ids
#     billboard              MK64 turns it to face the camera: two crossed copies with both faces
#     tlut, texture          what the render code loads before the DL: the palette, the texture (segment 3)
#     lit                    drawn with G_LIGHTING: the vertex colors are normals, so white
#     both                   drawn with culling off
#     ground                 false: not dropped onto the ground (default true)
#     trunk                  [radius, height]: a COL_WALL octagon (boundingBoxSize, unk_08 in actor_init)
#     spin                   seconds per turn: a MOVE_ object (the signs: rot[1] += DEGREES(1) per tick, 60 a second)
#     circle                 [center x, center z, radius, seconds per lap, turns per lap]: a MOVE_ object (Yoshi egg)
#   decomp_addrs.py finds the decomp's names in segment 6.

[rom]
main_vram_to_rom = 0x7FFFF400   # main code segment: rom = vram - this (the US build: 0x80000400 at ROM 0x1000)
common_data = 0x132B50          # segment 0x0D (yamls/us/common_data.yml), MIO0
star_texture = 0x0D0293D8       # D_0D0293D8, I4 16 x 16: the star sprite init_star_object() gives every star
sky_top = 0x801214E0            # sTopSkyBoxColors[course]: { s16 top r, g, b, horizon r, g, b }
sky_bottom = 0x801215DC         # sBottomSkyBoxColors[course]: { s16 horizon r, g, b, bottom r, g, b }

[stars]
toads_turnpike_rainbow_road = 0x800E6C80   # gToadsTurnpikeRainbowRoadStars
wario_stadium = 0x800E6DE0                 # gWarioStadiumStars

[course.rainbow_road]
name = "Rainbow Road"
vertex_colors = [[0x07002068, 150, 255, 255, 255], [0x07001E18, 150, 255, 255, 255], [0x07001318, 255, 255, 255, 0],
                 [0x07001FB8, 150, 255, 255, 255]]
stars = "toads_turnpike_rainbow_road"
kill_below = true
wall_height = 4.0
checkpoints = 6
# Sim runs (2026-10-15): the two long drops (path 4-129 and 555-827, the stretches MK64's CPU table D_0D0092C8 marks
# with behaviours 9/10) carry Rush 2 cars past 200 mph into the dips at their feet, and the hairpin at 720 and the
# spiral at 930 throw them into the rails at the converter's speeds. 7 wrecks a race without these, 1 with.
ai_speed = [[30, 120], [135, 0], [450, 120], [580, 0], [705, 110], [785, 0], [915, 115], [1005, 0]]

